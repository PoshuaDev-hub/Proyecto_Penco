server {
    listen 80;
    server_name _;

    # Archivos estáticos de Django
    location /static/ {
        alias /opt/Hospital_Penco_IA/backend/staticfiles/;
    }

    # Archivos subidos por usuarios (documentos de postulación, CVs, etc.)
    location /media/ {
        alias /opt/Hospital_Penco_IA/backend/media/;
    }

    # API REST de Django
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Panel Administrativo de Django
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend SPA (React + Vite)
    location / {
        root /opt/Hospital_Penco_IA/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
